[package]
name = "eel-macros"
version = "0.0.3"
edition = "2024"

[lib]
proc-macro = true

[dependencies]
proc-macro-crate = "1.3.1"
proc-macro2 = "1.0.103"
quote = "1.0.42"
syn = { version = "2.0.111", features = ["full"] }
eel-key-parse = { version = "0.0.3", path = "../eel-key-parse", optional = true }

[features]
keymap = ["dep:eel-key-parse"]
modal = ["keymap"]
