[package]
name = "eel"
version = "0.0.3"
edition = "2024"

[dependencies]
itertools = "0.14.0"
thiserror = "2.0.17"
tracing = "0.1.44"
tracing-appender = "0.2.4"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
paste = { version = "1.0.15", optional = true }
rayon = { version = "1.11.0", optional = true }
sequence_trie = { version = "0.3.6", optional = true }
eel-macros = { version = "0.0.3", path = "../eel-macros" }
eel-key-parse = { version = "0.0.3", path = "../eel-key-parse", optional = true }

[features]
default = ["cursor", "mark", "region", "window", "keymap", "modal"]
tests = ["dep:paste", "dep:rayon"]
cursor = []
mark = []
region = ["mark"]
window = []
keymap = ["dep:sequence_trie", "dep:eel-key-parse", "eel-macros/keymap"]
modal = ["keymap", "eel-macros/modal"]
